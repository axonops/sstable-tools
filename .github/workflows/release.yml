name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Set up Go for nFPM
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install Linux package tooling
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes cpio rpm rpm2cpio

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Invalid release version: %s\n' "$version" >&2
            exit 1
          }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify all artifacts
        run: >-
          mvn -B -ntp clean verify
          -Drevision=${{ steps.release.outputs.version }}

      - name: Import release signing key
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "$RELEASE_GPG_PRIVATE_KEY" ]]; then
            printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          else
            echo "No release signing key configured; checksums will be unsigned."
          fi

      - name: Package and verify release bundle, DEB, and RPM
        env:
          HAS_SIGNING_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
        run: |
          release_dir="target/release/sstable-tools-${{ steps.release.outputs.version }}"
          scripts/package-release \
            --output target/release \
            --version "${{ steps.release.outputs.version }}"
          args=(--release-dir "$release_dir")
          if [[ "$HAS_SIGNING_KEY" == true ]]; then
            args+=(--sign)
          fi
          scripts/package-linux-packages "${args[@]}"
          scripts/verify-linux-packages "$release_dir"
          scripts/verify-release-bundle "$release_dir"

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: sstable-tools-${{ steps.release.outputs.version }}
          if-no-files-found: error
          path: |
            target/release/sstable-tools-${{ steps.release.outputs.version }}/
            target/release/sstable-tools-${{ steps.release.outputs.version }}.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            target/release/sstable-tools-${{ steps.release.outputs.version }}/* \
            target/release/sstable-tools-${{ steps.release.outputs.version }}.tar.gz \
            --target "$GITHUB_SHA" \
            --title "SSTable Tools ${{ steps.release.outputs.version }}" \
            --generate-notes

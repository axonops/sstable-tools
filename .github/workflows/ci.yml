name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full reactor verification (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build, test, and verify thin JARs
        run: mvn -B -ntp verify

      - name: Generate runtime dependency reports
        run: >-
          mvn -B -ntp dependency:tree
          -Dscope=runtime
          -DoutputFile=target/dependency-tree.txt

      - name: Upload thin JARs and dependency reports
        uses: actions/upload-artifact@v7
        with:
          name: thin-jars-and-dependency-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            workers/cassandra-*/target/sstable-tools-cassandra-*.jar
            **/target/dependency-tree.txt

  adapter-runtime:
    name: Cassandra ${{ matrix.adapter }} adapter on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: '3.11'
            java: '8'
            module: workers/cassandra-3.11
          - adapter: '4.0'
            java: '8'
            module: workers/cassandra-4.0
          - adapter: '4.0'
            java: '11'
            module: workers/cassandra-4.0
          - adapter: '4.1'
            java: '11'
            module: workers/cassandra-4.1
          - adapter: '5.0'
            java: '17'
            module: workers/cassandra-5.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Test adapter and required shared modules
        run: mvn -B -ntp -pl "${{ matrix.module }}" -am test

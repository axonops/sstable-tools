name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full reactor verification (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build, test, and verify thin JARs
        run: mvn -B -ntp verify

      - name: Publish executed test results
        if: always()
        run: bash scripts/ci-test-summary | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate runtime dependency reports
        run: >-
          mvn -B -ntp dependency:tree
          -Dscope=runtime
          -DoutputFile=target/dependency-tree.txt

      - name: Upload thin JARs and dependency reports
        uses: actions/upload-artifact@v7
        with:
          name: thin-jars-and-dependency-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            workers/cassandra-*/target/sstable-tools-cassandra-*.jar
            **/target/dependency-tree.txt

  adapter-runtime:
    name: Cassandra ${{ matrix.adapter }} adapter on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: '3.11'
            java: '8'
            module: workers/cassandra-3.11
          - adapter: '4.0'
            java: '8'
            module: workers/cassandra-4.0
          - adapter: '4.0'
            java: '11'
            module: workers/cassandra-4.0
          - adapter: '4.1'
            java: '11'
            module: workers/cassandra-4.1
          - adapter: '5.0'
            java: '17'
            module: workers/cassandra-5.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Test adapter and required shared modules
        run: mvn -B -ntp -pl "${{ matrix.module }}" -am test

      - name: Publish executed test results
        if: always()
        run: bash scripts/ci-test-summary | tee -a "$GITHUB_STEP_SUMMARY"

  stopped-cqlsh-source:
    name: Cassandra ${{ matrix.release }} stopped stock-cqlsh source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '3.11'
            image: cassandra:3.11.19
            module: workers/cassandra-3.11
          - release: '4.0'
            image: cassandra:4.0.17
            module: workers/cassandra-4.0
          - release: '4.1'
            image: cassandra:4.1.3
            module: workers/cassandra-4.1
          - release: '5.0'
            image: cassandra:5.0.4
            module: workers/cassandra-5.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up build Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build matching thin JAR
        run: mvn -B -ntp -pl "${{ matrix.module }}" -am package -DskipTests

      - name: Generate SSTables through stock cqlsh after source shutdown
        run: >-
          scripts/ci-real-cassandra-source
          --image "${{ matrix.image }}"
          --release "${{ matrix.release }}"
          --tool-jar "${{ matrix.module }}/target/sstable-tools-cassandra-${{ matrix.release }}-3.11.0-alpha12-SNAPSHOT.jar"
          --output-root "${{ runner.temp }}/cassandra-source-${{ matrix.release }}"

      - name: Upload source lifecycle diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cassandra-${{ matrix.release }}-stopped-source-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/cassandra-source-${{ matrix.release }}

  cassandra-311-sandbox:
    name: Cassandra 3.11.19 sandbox and cqlsh integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Cassandra Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Record Cassandra Java home
        run: echo "CASSANDRA_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up build Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Download pinned Cassandra 3.11.19 distribution
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://archive.apache.org/dist/cassandra/3.11.19/apache-cassandra-3.11.19-bin.tar.gz
          echo '42d7732c2b81c65a960101d1146603d430de341adcdf8d0ffc649753a340cf64dad696050f2ec01faff5f15e726f4f2a459f0b3ac281569b957f7726f51d43e0  apache-cassandra-3.11.19-bin.tar.gz' | sha512sum --check
          tar -xzf apache-cassandra-3.11.19-bin.tar.gz

      - name: Extract pinned Cassandra 3.11.19 Debian and RPM layouts
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://debian.cassandra.apache.org/pool/main/c/cassandra/cassandra_3.11.19_all.deb
          echo 'c20d57d722e711c093cc5f12f04046775aa16a69816ade831540f70feffbc894  cassandra_3.11.19_all.deb' | sha256sum --check
          mkdir cassandra-debian
          dpkg-deb -x cassandra_3.11.19_all.deb cassandra-debian
          sudo apt-get update
          sudo apt-get install --yes rpm2cpio cpio
          curl -fsSLO https://redhat.cassandra.apache.org/311x/cassandra-3.11.19-1.noarch.rpm
          echo '57c03f8302ba325880e04c83f9ccf176ca3b627b9c62d594d81b929f3d9f0668  cassandra-3.11.19-1.noarch.rpm' | sha256sum --check
          mkdir cassandra-rpm
          rpm2cpio cassandra-3.11.19-1.noarch.rpm | (cd cassandra-rpm && cpio -idm)

      - name: Install pinned Python 2.7 runtime for Cassandra cqlsh
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://downloads.python.org/pypy/pypy2.7-v7.3.20-linux64.tar.bz2
          echo 'aa3bb92dbb529fa2d4920895b16d67a810b0c709207857d56cfe4a6e3b41e02a  pypy2.7-v7.3.20-linux64.tar.bz2' | sha256sum --check
          tar -xjf pypy2.7-v7.3.20-linux64.tar.bz2
          echo "${{ runner.temp }}/pypy2.7-v7.3.20-linux64/bin" >> "$GITHUB_PATH"

      - name: Test isolated daemon, cqlsh mutations, and crash recovery
        run: >-
          mvn -B -ntp clean verify
          -pl workers/cassandra-3.11 -am
          -Pcassandra-3.11-sandbox-it
          -Dcassandra311.home=${{ runner.temp }}/apache-cassandra-3.11.19
          -Dcassandra311.java.home="$CASSANDRA_JAVA_HOME"

      - name: Publish executed test results
        if: always()
        run: bash scripts/ci-test-summary | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preflight extracted Debian and RPM Cassandra layouts
        run: |
          TOOL_JAR=workers/cassandra-3.11/target/sstable-tools-cassandra-3.11-3.11.0-alpha12-SNAPSHOT.jar
          java -jar "$TOOL_JAR" \
            --cassandra-home "${{ runner.temp }}/cassandra-debian/usr/share/cassandra" \
            --cassandra-conf "${{ runner.temp }}/cassandra-debian/etc/cassandra" \
            --java-home "$CASSANDRA_JAVA_HOME" runtime preflight
          java -jar "$TOOL_JAR" \
            --cassandra-home "${{ runner.temp }}/cassandra-rpm/usr/share/cassandra" \
            --cassandra-conf "${{ runner.temp }}/cassandra-rpm/etc/cassandra/default.conf" \
            --java-home "$CASSANDRA_JAVA_HOME" runtime preflight

  cassandra-40-sandbox:
    name: Cassandra 4.0.17 stopped-SSTable sandbox and cqlsh integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Cassandra Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Set up Python for stock Cassandra cqlsh
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download pinned Cassandra 4.0.17 distribution
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://archive.apache.org/dist/cassandra/4.0.17/apache-cassandra-4.0.17-bin.tar.gz
          echo '7f72941dd1c73e30361cc2aad55dabd7005e95f2275c9190645fd0467cac6da67f8602ffbae53fb98367cb67116b4e271b8293381d7d5041267ce2437e8273be  apache-cassandra-4.0.17-bin.tar.gz' | sha512sum --check
          tar -xzf apache-cassandra-4.0.17-bin.tar.gz
          python -m pip install --disable-pip-version-check --user \
            'cassandra-driver>=3.29,<4' 'six>=1.16'

      - name: Build Cassandra 4.0 adapter
        run: mvn -B -ntp -pl workers/cassandra-4.0 -am package -DskipTests

      - name: Import a stopped stock-cqlsh Cassandra 4.0 SSTable
        run: >-
          scripts/ci-real-cassandra-source
          --image cassandra:4.0.17
          --release 4.0
          --tool-jar workers/cassandra-4.0/target/sstable-tools-cassandra-4.0-3.11.0-alpha12-SNAPSHOT.jar
          --output-root "${{ runner.temp }}/cassandra-40-import"
          --import-cassandra-home "${{ runner.temp }}/apache-cassandra-4.0.17"
          --java-home "$JAVA_HOME"

      - name: Mutate the imported SSTable through stock Cassandra 4.0 cqlsh
        run: |
          TOOL_JAR=workers/cassandra-4.0/target/sstable-tools-cassandra-4.0-3.11.0-alpha12-SNAPSHOT.jar
          CASSANDRA_HOME="${{ runner.temp }}/apache-cassandra-4.0.17"
          WORKSPACE="${{ runner.temp }}/cassandra-40-import/workspace"
          OUTPUT="${{ runner.temp }}/cassandra-40-import/export"
          java -jar "$TOOL_JAR" --cassandra-home "$CASSANDRA_HOME" --java-home "$JAVA_HOME" \
            --timestamp-policy after-source workspace start "$WORKSPACE" \
            | tee "${{ runner.temp }}/cassandra-40-import/workspace-start.log"
          java -jar "$TOOL_JAR" --cassandra-home "$CASSANDRA_HOME" --java-home "$JAVA_HOME" \
            --execute "INSERT INTO ci_source.events (event_id, payload, state) VALUES ('sandbox-row', 'inserted', 'new') USING TIMESTAMP 2000000000000000;" \
            workspace cqlsh "$WORKSPACE" \
            | tee "${{ runner.temp }}/cassandra-40-import/cqlsh-insert.log"
          java -jar "$TOOL_JAR" --cassandra-home "$CASSANDRA_HOME" --java-home "$JAVA_HOME" \
            --execute "UPDATE ci_source.events USING TIMESTAMP 2000000000000001 SET payload = 'updated', state = 'ready' WHERE event_id = 'sandbox-row';" \
            workspace cqlsh "$WORKSPACE" \
            | tee "${{ runner.temp }}/cassandra-40-import/cqlsh-update.log"
          java -jar "$TOOL_JAR" --cassandra-home "$CASSANDRA_HOME" --java-home "$JAVA_HOME" \
            --execute "SELECT event_id, payload, state FROM ci_source.events WHERE event_id = 'sandbox-row';" \
            workspace cqlsh "$WORKSPACE" \
            | tee "${{ runner.temp }}/cassandra-40-import/cqlsh-select.log"
          grep -q 'sandbox-row' "${{ runner.temp }}/cassandra-40-import/cqlsh-select.log"
          grep -q 'updated' "${{ runner.temp }}/cassandra-40-import/cqlsh-select.log"
          grep -q 'ready' "${{ runner.temp }}/cassandra-40-import/cqlsh-select.log"
          java -jar "$TOOL_JAR" workspace flush "$WORKSPACE" \
            | tee "${{ runner.temp }}/cassandra-40-import/workspace-flush.log"
          java -jar "$TOOL_JAR" --mode delta --output "$OUTPUT" workspace export "$WORKSPACE" \
            | tee "${{ runner.temp }}/cassandra-40-import/workspace-export.log"
          java -jar "$TOOL_JAR" workspace stop "$WORKSPACE" \
            | tee "${{ runner.temp }}/cassandra-40-import/workspace-stop.log"

      - name: Upload import diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cassandra-40-sandbox-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/cassandra-40-import
